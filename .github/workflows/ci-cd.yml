name: CI/CD Mini-Bank

# CONCETTO: quando far partire questo workflow.
# Qui: Qui: ad ogni push su main e ad ogni pull request verso main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # CONCETTO — matrix build: questa lista dice a GitHub
    # "esegui tutti gli step sotto, una volta per ciascun valore qui elencato".
    # Aggiungere un ottavo servizio in futuro = aggiungere una riga qui,
    # nessun altro cambiamento al file.
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - customer-service
          - transaction-service
          - notification-service
          - api-gateway
          - eureka-server
          - config-server

    steps:
      # SINTASSI: scarica il codice della repo dentro il runner.
      # Senza questo step, il runner è una macchina vuota senza il tuo codice.
      - name: Checkout codice
        uses: actions/checkout@v4

      # SINTASSI: installa Java 21 sul runner (pulito, senza nulla di tuo).
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # CONCETTO: ${{ matrix.service }} viene sostituito, ad ogni esecuzione
      # parallela, col valore corrente della lista sopra (es. account-service).
      # -f punta al pom.xml dentro la cartella di quel modulo specifico,
      # dato che non c'è un pom padre nella root.
      - name: Build e test - ${{ matrix.service }}
        run: mvn -f ${{ matrix.service }}/pom.xml clean verify

      # SINTASSI: login su Docker Hub usando i Secrets configurati.
      - name: Login su Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # CONCETTO: costruisce l'immagine usando il Dockerfile già presente
      - name: Build immagine Docker - ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

      # 2. Scansiona: se trova HIGH o CRITICAL non accettate, la pipeline fallisce
      - name: Scansione vulnerabilità - ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      # 3. Pubblica solo su push in main, e solo se la scansione è passata
      - name: Push su Docker Hub - ${{ matrix.service }}
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}