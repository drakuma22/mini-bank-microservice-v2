server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: configserver:http://config-server:8888
  cloud:
    config:
      fail-fast: true          # se non trova il config-server: errore, non "parto lo stesso"
      retry:
        initial-interval: 2000 # primo tentativo dopo 2 secondi
        multiplier: 1.5        # ogni attesa è 1,5 volte la precedente
        max-interval: 10000    # mai più di 10 secondi di attesa
        max-attempts: 10       # 10 tentativi, poi si arrende
    gateway:
      server:
        webmvc:
          routes:
            - id: account-service
              uri: http://account-service:8081
              predicates:
                - Path=/api/accounts/**
              filters:
                - StripPrefix=1

            - id: customer-service
              uri: http://customer-service:8082
              predicates:
                - Path=/api/customers/**
              filters:
                - StripPrefix=1

            - id: transaction-service
              uri: http://transaction-service:8083
              predicates:
                - Path=/api/transactions/**
              filters:
                - StripPrefix=1