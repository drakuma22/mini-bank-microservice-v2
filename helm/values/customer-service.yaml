replicaCount: 1

image:
  repository: finalfantasy22x/customer-service
  tag: d5223929f0dad71055a3168b2d065915459412fb

port: 8082

resources:            # taglia M
  requests:
    memory: 512Mi
    cpu: 100m
  limits:
    memory: 768Mi
    cpu: "1"

env:
  - name: SPRING_DATASOURCE_URL
    value: jdbc:postgresql://customer-db:5432/customer_db
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      configMapKeyRef:
        name: customer-db-config
        key: POSTGRES_USER
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: customer-db-secret
        key: POSTGRES_PASSWORD