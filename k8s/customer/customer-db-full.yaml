# ============================================
# STATEFULSET — il Pod di Postgres, con identità e volume stabili
# ============================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: customer-db
spec:
  # CONCETTO: il Service che "governa" lo StatefulSet.
  serviceName: customer-db
  replicas: 1
  selector:
    matchLabels:
      app: customer-db
  template:
    metadata:
      labels:
        app: customer-db
    spec:
      containers:
        - name: customer-db
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: customer-db-config
            - secretRef:
                name: customer-db-secret
          env:
            - name: POSTGRES_DB
              value: customer_db
            # I dati in una sottocartella del volume: necessario sui dischi del cloud.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # CONCETTO: DOVE, nel filesystem del container, agganciare lo storage.
          # Il nome deve corrispondere a quello del volumeClaimTemplate qui sotto.
          volumeMounts:
            - name: customer-db-data
              mountPath: /var/lib/postgresql/data
  # CONCETTO: uno "stampo" di PVC. Lo StatefulSet crea da solo un PVC per ogni
  # replica, chiamato <nome-template>-<nome-pod>: customer-db-data-customer-db-0.
  # Sostituisce sia il blocco PVC scritto a mano sia la sezione volumes.
  volumeClaimTemplates:
    - metadata:
        name: customer-db-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
# ============================================
# SERVICE — nome stabile per raggiungere il DB
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: customer-db
spec:
  selector:
    app: customer-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
