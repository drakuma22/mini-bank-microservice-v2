# SINTASSI: apiVersion diversa da Deployment — ogni "tipo" di oggetto K8s
# ha la propria coppia apiVersion/kind, da imparare per i tipi che userai spesso.
apiVersion: v1
kind: Service

metadata:
  # CONCETTO IMPORTANTE: questo nome diventa un hostname risolvibile
  # dentro il cluster — esattamente come il nome di un servizio in
  # docker-compose.yml (es. "zookeeper:2181" funzionava perché
  # Compose crea un DNS interno basato sui nomi dei servizi).
  # Kubernetes fa la stessa cosa, ma basata sul nome del Service, non del Pod.
  name: zookeeper

spec:
  # CONCETTO — selector: ESATTAMENTE lo stesso meccanismo del Deployment.
  # Il Service non "conosce" i Pod per nome — li trova cercando questa label.
  # Deve combaciare con "template.metadata.labels" nel Deployment.
  selector:
    app: zookeeper

  ports:
    # CONCETTO: due porte diverse, con ruoli diversi.
    # port = la porta su cui il Service stesso è raggiungibile
    # targetPort = la porta su cui il container dentro il Pod ascolta davvero
    # (di solito coincidono, ma non devono per forza — qui restano uguali
    # perché il Pod di zookeeper ascolta su 2181, come da Dockerfile)
    - port: 2181
      targetPort: 2181

  # CONCETTO — type: decide DA DOVE il Service è raggiungibile.
  # ClusterIP (il default se ometti questa riga) = raggiungibile SOLO
  # da dentro il cluster, da altri Pod — non dal tuo browser/Postman locale.
  # Corretto per zookeeper: solo altri microservizi devono parlargli,
  # non serve esporlo all'esterno.
  type: ClusterIP
