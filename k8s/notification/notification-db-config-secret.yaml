# ============================================
# CONFIGMAP — valore non sensibile (lo username)
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-db-config
data:
  # SINTASSI: semplici coppie chiave-valore, testo in chiaro.
  # Chiunque veda questo file (o lo interroghi con kubectl) legge il valore diretto.
  POSTGRES_USER: "minibank"

---
# ============================================
# SECRET — valore sensibile (la password)
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: notification-db-secret
# CONCETTO: "type: Opaque" è il tipo generico per dati arbitrari
# (esistono tipi speciali per casi specifici, es. certificati TLS,
# ma per credenziali "vostre" Opaque è quello giusto).
type: Opaque
data:
  # SINTASSI: qui il valore NON è testo in chiaro come nel ConfigMap —
  # deve essere codificato in Base64 PRIMA di scriverlo nel file.
  # "minibank123" in Base64 diventa questa stringa:
  POSTGRES_PASSWORD: bWluaWJhbmsxMjM=
