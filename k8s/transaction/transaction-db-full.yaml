# ============================================
# DEPLOYMENT — il Pod di Postgres
# ============================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: transaction-db
spec:
  serviceName: transaction-db
  replicas: 1
  selector:
    matchLabels:
      app: transaction-db
  template:
    metadata:
      labels:
        app: transaction-db
    spec:
      containers:
        - name: transaction-db
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: transaction-db-config
            - secretRef:
                name: transaction-db-secret
          env:
            - name: POSTGRES_DB
              value: transaction_db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: transaction-db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: transaction-db-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
# ============================================
# SERVICE — nome stabile per raggiungere il DB
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: transaction-db
spec:
  selector:
    app: transaction-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
